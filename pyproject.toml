[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingcli"
dynamic = ["version"]
description = "Local multi-account paper-trading CLI, terminal dashboard, and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ryan Rodrigues" }]
keywords = ["paper-trading", "cli", "sqlite", "mcp", "portfolio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "backtesting>=0.6.5,<1",
  "cryptography>=44,<50",
  "exchange-calendars>=4.13,<5",
  "mcp>=1.27,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "rich>=13,<15",
  "skfolio>=0.6,<1",
  "yfinance>=1,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ruff>=0.15,<1",
]

[project.scripts]
tradingcli = "papertrade:main"
tradingcli-dashboard = "dashboard:main"
tradingcli-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = [
  "dashboard",
  "mcp_server",
  "papertrade",
  "portfolio_backtest",
  "portfolio_optimize",
  "tradingcli_features",
]

[tool.setuptools.dynamic]
version = { attr = "papertrade.VERSION" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
