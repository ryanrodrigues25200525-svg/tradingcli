[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingcli"
version = "0.4.0"
description = "Local multi-account paper-trading CLI, live TUI dashboard, REST + MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tradingcli" }]
keywords = ["trading", "paper-trading", "cli", "mcp", "backtesting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
]
dependencies = [
  "backtesting>=0.6.5,<1",
  "exchange-calendars>=4.13,<5",
  "mcp>=1.27,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "rich>=13,<15",
  "yfinance>=1,<2",
  "fastapi>=0.100,<1",
  "uvicorn>=0.20,<1",
]

[project.scripts]
tradingcli = "papertrade:main"
tradingcli-web = "web_ui:main"
tradingcli-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/ryanrodrigues25200525-svg/tradingcli"

[tool.hatch.build]
include = ["LICENSE", "docs/agent-guide.md", "papertrade.py", "mcp_server.py", "dashboard.py", "web_ui.py", "portfolio_backtest.py", "static/", "README.md"]

[tool.hatch.build.targets.wheel]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

