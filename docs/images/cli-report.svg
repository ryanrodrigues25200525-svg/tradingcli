<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TradingCLI simulation report and performance benchmark</title>
  <desc id="desc">An offline paper-trading report with balanced ledger and a benchmark showing fast startup and database access.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151023"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#070a12"/>
  <circle cx="1160" cy="650" r="280" fill="#6d5dfc" opacity=".10"/>
  <g filter="url(#shadow2)">
    <rect x="55" y="42" width="1090" height="630" rx="18" fill="url(#bg2)" stroke="#303652"/>
    <rect x="55" y="42" width="1090" height="52" rx="18" fill="#191b2a"/>
    <rect x="55" y="76" width="1090" height="18" fill="#191b2a"/>
  </g>
  <circle cx="88" cy="68" r="7" fill="#ff5f57"/>
  <circle cx="112" cy="68" r="7" fill="#febc2e"/>
  <circle cx="136" cy="68" r="7" fill="#28c840"/>
  <text x="600" y="74" text-anchor="middle" fill="#a9b4ca" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">tradingcli report summary</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="88" y="142" fill="#45d483" font-size="20">❯</text>
    <text x="118" y="142" fill="#e8edf7" font-size="20">tradingcli report summary</text>
    <text x="90" y="192" fill="#94a3b8" font-size="18">account</text>
    <text x="300" y="192" fill="#f9a8d4" font-size="18">demo-growth</text>
    <text x="90" y="234" fill="#94a3b8" font-size="18">cash</text>
    <text x="300" y="234" fill="#e8edf7" font-size="18">$90,177.50</text>
    <text x="90" y="276" fill="#94a3b8" font-size="18">equity</text>
    <text x="300" y="276" fill="#45d483" font-size="18">$100,000.00</text>
    <text x="90" y="318" fill="#94a3b8" font-size="18">positions</text>
    <text x="300" y="318" fill="#e8edf7" font-size="18">2</text>
    <text x="90" y="360" fill="#94a3b8" font-size="18">cached marks</text>
    <text x="300" y="360" fill="#7dd3fc" font-size="18">2 fresh · 0 stale</text>
    <text x="90" y="402" fill="#94a3b8" font-size="18">completed orders</text>
    <text x="300" y="402" fill="#e8edf7" font-size="18">2</text>
    <text x="90" y="444" fill="#94a3b8" font-size="18">ledger</text>
    <text x="300" y="444" fill="#45d483" font-size="18">✓ balanced</text>
    <text x="90" y="486" fill="#94a3b8" font-size="18">live execution</text>
    <text x="300" y="486" fill="#ff7190" font-size="18">false</text>
  </g>
  <g transform="translate(610 134)">
    <rect width="480" height="390" rx="14" fill="#111827" stroke="#33405d"/>
    <text x="28" y="48" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">⚡ PERFORMANCE BUDGET</text>
    <text x="28" y="98" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">startup median</text>
    <text x="320" y="98" fill="#45d483" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">20.0 ms ✓</text>
    <rect x="28" y="118" width="412" height="12" rx="6" fill="#26324d"/>
    <rect x="28" y="118" width="110" height="12" rx="6" fill="#45d483"/>
    <text x="28" y="178" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">database median</text>
    <text x="320" y="178" fill="#45d483" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">0.9 ms ✓</text>
    <rect x="28" y="198" width="412" height="12" rx="6" fill="#26324d"/>
    <rect x="28" y="198" width="40" height="12" rx="6" fill="#7dd3fc"/>
    <text x="28" y="265" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">startup budget</text>
    <text x="320" y="265" fill="#e8edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">&lt; 75 ms</text>
    <text x="28" y="307" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">database budget</text>
    <text x="320" y="307" fill="#e8edf7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">&lt; 10 ms</text>
    <text x="28" y="355" fill="#45d483" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">✓ all budgets passed</text>
  </g>
  <text x="88" y="620" fill="#7c8aa5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Offline-first · SQLite-backed · local simulation only</text>
</svg>
